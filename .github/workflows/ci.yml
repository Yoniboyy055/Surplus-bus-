# CI: lint, type-check, unit tests, migration dry run, ingest e2e and Playwright.
# No secrets are used: every database/API in these jobs is local (PGlite + mock Supabase).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migration dry run (live schema snapshot + 051-055, PGlite)
        working-directory: scripts/db-dryrun
        run: |
          npm install --no-audit --no-fund
          npm run -s after | tee after.txt
          grep -q "SUMMARY: \([0-9]*\)/\1 expectations met" after.txt
          npm run -s idempotency | grep -E "SUMMARY"
      - name: Pending migrations dry run (056 kind overrides, 057 lot reports; not applied to live)
        working-directory: scripts/db-dryrun
        run: |
          npm run -s pending | tee pending.txt
          grep -q "SUMMARY: \([0-9]*\)/\1 expectations met" pending.txt
          npm run -s pending:idempotency | tee pending-idem.txt
          grep -q "SUMMARY: \([0-9]*\)/\1 expectations met" pending-idem.txt
      - name: Ingest e2e (fixtures)
        run: npx tsx scripts/db-dryrun/e2e-ingest.ts | tee ingest.txt && grep -q "SUMMARY: ALL PASS" ingest.txt
      - name: Search filters behave the same in Postgres and JS
        run: npx tsx scripts/db-dryrun/search-parity.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: e2e/run.sh
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/screenshots
          retention-days: 7
